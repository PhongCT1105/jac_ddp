[project]
name = "connection-agent"
version = "0.1.0"
description = "Connection Agent web application with Mock/Live JacGrid compute adapters."
entry-point = "main.jac"
kind = "web-app"
jac-version = ">=0.34.6"

[dependencies]
requests = "~=2.32"

[byllm.model]
default_model = "gpt-5.6-terra"

[byllm.call_params]
max_tokens = 700

[test]
directory = "tests"
filter = "*_tests.jac"
verbose = true

[serve]
port = 8080

[scripts]
check = "jac check src tests && jac test -d tests"
demo = "jac run src/main.jac"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"
